<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A5C"/>
      <stop offset="100%" style="stop-color:#0D2137"/>
    </linearGradient>
    <linearGradient id="og" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E67E22"/>
      <stop offset="100%" style="stop-color:#F39C12"/>
    </linearGradient>
    <linearGradient id="cold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5DADE2"/>
      <stop offset="100%" style="stop-color:#AED6F1"/>
    </linearGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FAD7A0"/>
      <stop offset="100%" style="stop-color:#F0B27A"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="#F4F6F8"/>
  <rect width="1080" height="190" fill="url(#hdr)"/>
  <rect width="1080" height="6" fill="url(#og)"/>

  <text x="540" y="72" font-family="Arial, sans-serif" font-size="26" fill="#A8C8E8" text-anchor="middle">RÉGLEMENTATION RTBM</text>
  <text x="540" y="135" font-family="Arial, sans-serif" font-size="50" font-weight="900" fill="#FFFFFF" text-anchor="middle">ISOLATION THERMIQUE</text>
  <text x="540" y="178" font-family="Arial, sans-serif" font-size="22" fill="#E67E22" text-anchor="middle" font-weight="700">Ce que la réglementation impose au Maroc</text>

  <!-- Band -->
  <rect x="0" y="190" width="1080" height="46" fill="#E67E22"/>
  <text x="540" y="220" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">RTBM (Règlement Thermique du Bâtiment au Maroc) — Obligatoire depuis 2014</text>

  <!-- Wall cross-section diagram -->
  <g transform="translate(80, 260)">
    <text x="385" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1B3A5C" text-anchor="middle">COUPE D'UN MUR CONFORME RTBM</text>

    <!-- EXTERIOR label -->
    <text x="30" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#5DADE2" text-anchor="middle">EXTÉRIEUR</text>
    <text x="30" y="100" font-family="Arial, sans-serif" font-size="14" fill="#5DADE2" text-anchor="middle">Froid</text>
    <text x="30" y="118" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">❄️</text>

    <!-- INTERIOR label -->
    <text x="760" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#E67E22" text-anchor="middle">INTÉRIEUR</text>
    <text x="760" y="100" font-family="Arial, sans-serif" font-size="14" fill="#E67E22" text-anchor="middle">Chaud</text>
    <text x="760" y="118" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">☀️</text>

    <!-- Wall layers -->
    <!-- Layer 1: Enduit extérieur -->
    <rect x="65" y="130" width="40" height="380" fill="#BDC3C7"/>
    <text transform="translate(85,320) rotate(-90)" font-family="Arial, sans-serif" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">Enduit ext.</text>

    <!-- Layer 2: Brique (maçonnerie ext) -->
    <rect x="105" y="130" width="100" height="380" fill="#C0392B" opacity="0.7"/>
    <!-- Brick pattern -->
    <g stroke="#A93226" stroke-width="1" fill="none">
      <line x1="105" y1="175" x2="205" y2="175"/><line x1="105" y1="220" x2="205" y2="220"/>
      <line x1="105" y1="265" x2="205" y2="265"/><line x1="105" y1="310" x2="205" y2="310"/>
      <line x1="105" y1="355" x2="205" y2="355"/><line x1="105" y1="400" x2="205" y2="400"/>
      <line x1="105" y1="445" x2="205" y2="445"/>
      <line x1="155" y1="130" x2="155" y2="175"/><line x1="155" y1="220" x2="155" y2="265"/>
      <line x1="155" y1="310" x2="155" y2="355"/><line x1="155" y1="400" x2="155" y2="445"/>
    </g>
    <text transform="translate(155,320) rotate(-90)" font-family="Arial, sans-serif" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">Brique</text>

    <!-- Layer 3: ISOLANT (highlighted) -->
    <rect x="205" y="110" width="140" height="420" rx="4" fill="#F9E79F" stroke="#F39C12" stroke-width="3"/>
    <!-- Insulation pattern (wavy lines) -->
    <g stroke="#F39C12" stroke-width="2" fill="none" opacity="0.5">
      <path d="M215 150 Q235 140 255 150 Q275 160 295 150 Q315 140 335 150"/>
      <path d="M215 180 Q235 170 255 180 Q275 190 295 180 Q315 170 335 180"/>
      <path d="M215 210 Q235 200 255 210 Q275 220 295 210 Q315 200 335 210"/>
      <path d="M215 240 Q235 230 255 240 Q275 250 295 240 Q315 230 335 240"/>
      <path d="M215 270 Q235 260 255 270 Q275 280 295 270 Q315 260 335 270"/>
      <path d="M215 300 Q235 290 255 300 Q275 310 295 300 Q315 290 335 300"/>
      <path d="M215 330 Q235 320 255 330 Q275 340 295 330 Q315 320 335 330"/>
      <path d="M215 360 Q235 350 255 360 Q275 370 295 360 Q315 350 335 360"/>
      <path d="M215 390 Q235 380 255 390 Q275 400 295 390 Q315 380 335 390"/>
      <path d="M215 420 Q235 410 255 420 Q275 430 295 420 Q315 410 335 420"/>
      <path d="M215 450 Q235 440 255 450 Q275 460 295 450 Q315 440 335 450"/>
      <path d="M215 480 Q235 470 255 480 Q275 490 295 480 Q315 470 335 480"/>
    </g>
    <text x="275" y="308" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#7B4A00" text-anchor="middle">ISOLANT</text>
    <text x="275" y="328" font-family="Arial, sans-serif" font-size="13" fill="#7B4A00" text-anchor="middle">Polystyrène</text>
    <text x="275" y="346" font-family="Arial, sans-serif" font-size="13" fill="#7B4A00" text-anchor="middle">ou laine roche</text>
    <!-- Arrow pointing to insulation -->
    <line x1="275" y1="100" x2="275" y2="108" stroke="#E67E22" stroke-width="2"/>
    <polygon points="275,110 270,100 280,100" fill="#E67E22"/>
    <rect x="210" y="80" width="130" height="28" rx="6" fill="#E67E22"/>
    <text x="275" y="99" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">RTBM Obligatoire</text>

    <!-- Layer 4: Brique (maçonnerie int) -->
    <rect x="345" y="130" width="100" height="380" fill="#C0392B" opacity="0.6"/>
    <g stroke="#A93226" stroke-width="1" fill="none">
      <line x1="345" y1="175" x2="445" y2="175"/><line x1="345" y1="220" x2="445" y2="220"/>
      <line x1="345" y1="265" x2="445" y2="265"/><line x1="345" y1="310" x2="445" y2="310"/>
      <line x1="345" y1="355" x2="445" y2="355"/><line x1="345" y1="400" x2="445" y2="400"/>
      <line x1="345" y1="445" x2="445" y2="445"/>
      <line x1="395" y1="130" x2="395" y2="175"/><line x1="395" y1="220" x2="395" y2="265"/>
      <line x1="395" y1="310" x2="395" y2="355"/><line x1="395" y1="400" x2="395" y2="445"/>
    </g>
    <text transform="translate(395,320) rotate(-90)" font-family="Arial, sans-serif" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">Brique</text>

    <!-- Layer 5: Enduit intérieur -->
    <rect x="445" y="130" width="40" height="380" fill="#E8ECEF"/>
    <text transform="translate(465,320) rotate(-90)" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D" font-weight="600" text-anchor="middle">Enduit int.</text>

    <!-- Dimension lines -->
    <line x1="65" y1="530" x2="205" y2="530" stroke="#BDC3C7" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="135" y="548" font-family="Arial, sans-serif" font-size="13" fill="#5D6D7E" text-anchor="middle">15–20 cm</text>

    <line x1="205" y1="542" x2="345" y2="542" stroke="#E67E22" stroke-width="2" stroke-dasharray="4"/>
    <text x="275" y="560" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E67E22" text-anchor="middle">5–8 cm</text>

    <line x1="345" y1="530" x2="485" y2="530" stroke="#BDC3C7" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="415" y="548" font-family="Arial, sans-serif" font-size="13" fill="#5D6D7E" text-anchor="middle">10–15 cm</text>
  </g>

  <!-- Right side: Requirements cards -->
  <g transform="translate(600, 270)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#1B3A5C">Exigences RTBM</text>

    <rect x="0" y="35" width="420" height="75" rx="8" fill="#fff"/>
    <rect x="0" y="35" width="6" height="75" rx="3" fill="#E67E22"/>
    <text x="22" y="62" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5C">Murs extérieurs</text>
    <text x="22" y="84" font-family="Arial, sans-serif" font-size="15" fill="#5D6D7E">R ≥ 1,0 m²·K/W</text>
    <text x="22" y="102" font-family="Arial, sans-serif" font-size="15" fill="#5D6D7E">Isolant ≥ 4 cm (λ = 0,04)</text>

    <rect x="0" y="125" width="420" height="75" rx="8" fill="#fff"/>
    <rect x="0" y="125" width="6" height="75" rx="3" fill="#2980B9"/>
    <text x="22" y="152" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5C">Toiture terrasse</text>
    <text x="22" y="174" font-family="Arial, sans-serif" font-size="15" fill="#5D6D7E">R ≥ 2,0 m²·K/W</text>
    <text x="22" y="192" font-family="Arial, sans-serif" font-size="15" fill="#5D6D7E">Isolant ≥ 8 cm (priorité absolue)</text>

    <rect x="0" y="215" width="420" height="75" rx="8" fill="#fff"/>
    <rect x="0" y="215" width="6" height="75" rx="3" fill="#27AE60"/>
    <text x="22" y="242" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5C">Plancher bas sur vide sanitaire</text>
    <text x="22" y="264" font-family="Arial, sans-serif" font-size="15" fill="#5D6D7E">R ≥ 1,5 m²·K/W</text>
    <text x="22" y="282" font-family="Arial, sans-serif" font-size="15" fill="#5D6D7E">Isolant ≥ 6 cm</text>

    <rect x="0" y="305" width="420" height="75" rx="8" fill="#fff"/>
    <rect x="0" y="305" width="6" height="75" rx="3" fill="#8E44AD"/>
    <text x="22" y="332" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5C">Menuiseries extérieures</text>
    <text x="22" y="354" font-family="Arial, sans-serif" font-size="15" fill="#5D6D7E">Double vitrage obligatoire</text>
    <text x="22" y="372" font-family="Arial, sans-serif" font-size="15" fill="#5D6D7E">Uw ≤ 2,6 W/m²·K</text>

    <!-- Savings box -->
    <rect x="0" y="400" width="420" height="105" rx="10" fill="#EAFAF1"/>
    <text x="210" y="428" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1E8449" text-anchor="middle">💰 Économies potentielles</text>
    <text x="210" y="456" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#27AE60" text-anchor="middle">-30% à -50%</text>
    <text x="210" y="480" font-family="Arial, sans-serif" font-size="15" fill="#5D6D7E" text-anchor="middle">sur la facture énergétique annuelle</text>
    <text x="210" y="498" font-family="Arial, sans-serif" font-size="15" fill="#5D6D7E" text-anchor="middle">Retour sur investissement : 5–8 ans</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="1020" width="1080" height="60" fill="#1B3A5C"/>
  <text x="540" y="1058" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#E67E22" text-anchor="middle">ShantiLink — Conformité RTBM · shantilink.ma</text>
</svg>
