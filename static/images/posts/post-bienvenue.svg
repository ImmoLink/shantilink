<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A5C"/>
      <stop offset="100%" style="stop-color:#0D2137"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E67E22"/>
      <stop offset="100%" style="stop-color:#F39C12"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Orange accent bar top -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#orange)"/>

  <!-- Orange accent bar bottom -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#orange)"/>

  <!-- Left decorative circle -->
  <circle cx="120" cy="315" r="200" fill="none" stroke="#E67E22" stroke-width="2" opacity="0.2"/>
  <circle cx="120" cy="315" r="150" fill="none" stroke="#E67E22" stroke-width="1" opacity="0.15"/>

  <!-- Right decorative circle -->
  <circle cx="1080" cy="315" r="200" fill="none" stroke="#E67E22" stroke-width="2" opacity="0.2"/>
  <circle cx="1080" cy="315" r="150" fill="none" stroke="#E67E22" stroke-width="1" opacity="0.15"/>

  <!-- Helmet icon (center-right area) -->
  <g transform="translate(880, 200)">
    <!-- Helmet body -->
    <ellipse cx="100" cy="90" rx="95" ry="70" fill="#E67E22"/>
    <!-- Helmet brim -->
    <rect x="-10" y="130" width="220" height="18" rx="9" fill="#CF6D17"/>
    <!-- Helmet shine -->
    <ellipse cx="65" cy="60" rx="35" ry="20" fill="#F39C12" opacity="0.5"/>
    <!-- Helmet band -->
    <rect x="5" y="128" width="190" height="8" fill="#A85914"/>
  </g>

  <!-- Building icon (left area) -->
  <g transform="translate(120, 180)" opacity="0.3">
    <!-- Building -->
    <rect x="0" y="60" width="80" height="120" fill="#fff"/>
    <rect x="20" y="0" width="40" height="60" fill="#fff"/>
    <!-- Windows -->
    <rect x="10" y="80" width="18" height="18" fill="#1B3A5C"/>
    <rect x="50" y="80" width="18" height="18" fill="#1B3A5C"/>
    <rect x="10" y="115" width="18" height="18" fill="#1B3A5C"/>
    <rect x="50" y="115" width="18" height="18" fill="#1B3A5C"/>
    <rect x="28" y="10" width="24" height="20" fill="#1B3A5C"/>
  </g>

  <!-- Main title -->
  <text x="600" y="240" font-family="Arial, sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">Bienvenue sur</text>
  <text x="600" y="315" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#E67E22" text-anchor="middle" letter-spacing="2">ShantiLink</text>

  <!-- Subtitle -->
  <text x="600" y="378" font-family="Arial, sans-serif" font-size="26" fill="#A8C8E8" text-anchor="middle">La communauté BTP du Maroc</text>

  <!-- Divider -->
  <rect x="420" y="405" width="360" height="3" rx="2" fill="url(#orange)"/>

  <!-- Tag line -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="20" fill="#C8DFF0" text-anchor="middle">Entrepreneurs · Clients · Experts · Matériaux</text>

  <!-- Badge bottom -->
  <rect x="470" y="490" width="260" height="46" rx="23" fill="#E67E22"/>
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Rejoignez la communauté</text>

  <!-- Bottom branding -->
  <text x="60" y="600" font-family="Arial, sans-serif" font-size="14" fill="#4A7095">ShantiLink.ma</text>
  <text x="1140" y="600" font-family="Arial, sans-serif" font-size="14" fill="#4A7095" text-anchor="end">Mai 2026</text>
</svg>
