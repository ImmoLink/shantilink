<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A5C"/>
      <stop offset="100%" style="stop-color:#0D2137"/>
    </linearGradient>
    <linearGradient id="og" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E67E22"/>
      <stop offset="100%" style="stop-color:#F39C12"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#F4F6F8"/>
  <rect width="1200" height="200" fill="url(#hdr)"/>
  <rect width="1200" height="6" fill="url(#og)"/>

  <!-- Header text -->
  <text x="600" y="80" font-family="Arial, sans-serif" font-size="28" fill="#A8C8E8" text-anchor="middle" font-weight="600">RÉGLEMENTATION</text>
  <text x="600" y="140" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">NORMES RPS 2011</text>
  <text x="600" y="185" font-family="Arial, sans-serif" font-size="26" fill="#E67E22" text-anchor="middle" font-weight="700">Parasismiques — Impact sur vos chantiers</text>

  <!-- Orange band -->
  <rect x="0" y="200" width="1200" height="48" fill="#E67E22"/>
  <text x="600" y="232" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Révisées 2024 — Applicables à tous les projets de construction au Maroc</text>

  <!-- Zone map (simplified Morocco shape as colored zones) -->
  <g transform="translate(60, 268)">
    <!-- Zone legend title -->
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#1B3A5C">Zones sismiques du Maroc</text>

    <!-- Simplified map background -->
    <rect x="0" y="40" width="480" height="440" rx="12" fill="#EBF5FB"/>

    <!-- Zone 0 - Very low (light blue) -->
    <ellipse cx="380" cy="120" rx="80" ry="60" fill="#AED6F1" opacity="0.8"/>
    <text x="380" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5C" text-anchor="middle">Zone 0</text>
    <text x="380" y="135" font-family="Arial, sans-serif" font-size="13" fill="#1B3A5C" text-anchor="middle">Très faible</text>

    <!-- Zone 1 - Low (green) -->
    <ellipse cx="240" cy="200" rx="100" ry="70" fill="#A9DFBF" opacity="0.8"/>
    <text x="240" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1B4A2C" text-anchor="middle">Zone 1</text>
    <text x="240" y="215" font-family="Arial, sans-serif" font-size="13" fill="#1B4A2C" text-anchor="middle">Faible</text>

    <!-- Zone 2 - Medium (yellow) -->
    <ellipse cx="120" cy="160" rx="90" ry="65" fill="#FAD7A0" opacity="0.9"/>
    <text x="120" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7B4A00" text-anchor="middle">Zone 2</text>
    <text x="120" y="175" font-family="Arial, sans-serif" font-size="13" fill="#7B4A00" text-anchor="middle">Modérée</text>

    <!-- Zone 3 - High (orange) -->
    <ellipse cx="100" cy="290" rx="80" ry="60" fill="#F0B27A" opacity="0.9"/>
    <text x="100" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#6E2B00" text-anchor="middle">Zone 3</text>
    <text x="100" y="305" font-family="Arial, sans-serif" font-size="13" fill="#6E2B00" text-anchor="middle">Forte</text>

    <!-- Zone 4 - Very high (red, Al Hoceima area) -->
    <ellipse cx="280" cy="100" rx="60" ry="45" fill="#EC7063" opacity="0.9"/>
    <text x="280" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7B0000" text-anchor="middle">Zone 4</text>
    <text x="280" y="115" font-family="Arial, sans-serif" font-size="13" fill="#7B0000" text-anchor="middle">Très forte</text>

    <!-- Atlantic coast line hint -->
    <path d="M 30 50 Q 20 200 40 380 Q 60 430 100 450" stroke="#2980B9" stroke-width="3" fill="none" opacity="0.4"/>

    <!-- City dots -->
    <circle cx="200" cy="230" r="6" fill="#1B3A5C"/>
    <text x="212" y="234" font-family="Arial, sans-serif" font-size="14" fill="#1B3A5C">Casablanca</text>
    <circle cx="160" cy="180" r="6" fill="#1B3A5C"/>
    <text x="172" y="184" font-family="Arial, sans-serif" font-size="14" fill="#1B3A5C">Rabat</text>
    <circle cx="280" cy="100" r="5" fill="#C0392B"/>
    <text x="292" y="90" font-family="Arial, sans-serif" font-size="13" fill="#C0392B">Al Hoceima</text>
    <circle cx="110" cy="310" r="5" fill="#7B4A00"/>
    <text x="122" y="314" font-family="Arial, sans-serif" font-size="14" fill="#7B4A00">Agadir</text>

    <!-- Map border -->
    <rect x="0" y="40" width="480" height="440" rx="12" fill="none" stroke="#BDC3C7" stroke-width="2"/>
  </g>

  <!-- Right side: Key obligations -->
  <g transform="translate(600, 268)">
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#1B3A5C">Obligations clés RPS 2011 révisées</text>

    <!-- Obligation cards -->
    <rect x="0" y="45" width="540" height="80" rx="10" fill="#fff"/>
    <rect x="0" y="45" width="6" height="80" rx="3" fill="#E74C3C"/>
    <text x="24" y="78" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1B3A5C">Étude géotechnique obligatoire</text>
    <text x="24" y="103" font-family="Arial, sans-serif" font-size="15" fill="#5D6D7E">Zones 2, 3 et 4 — avant tout permis de construire</text>

    <rect x="0" y="140" width="540" height="80" rx="10" fill="#fff"/>
    <rect x="0" y="140" width="6" height="80" rx="3" fill="#E67E22"/>
    <text x="24" y="173" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1B3A5C">Béton armé renforcé (R+2 et +)</text>
    <text x="24" y="198" font-family="Arial, sans-serif" font-size="15" fill="#5D6D7E">Dosage minimum 350 kg/m³ — aciers HA obligatoires</text>

    <rect x="0" y="235" width="540" height="80" rx="10" fill="#fff"/>
    <rect x="0" y="235" width="6" height="80" rx="3" fill="#27AE60"/>
    <text x="24" y="268" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1B3A5C">Chaînages horizontaux &amp; verticaux</text>
    <text x="24" y="293" font-family="Arial, sans-serif" font-size="15" fill="#5D6D7E">Obligatoires à chaque niveau — section min. 20×20 cm</text>

    <rect x="0" y="330" width="540" height="80" rx="10" fill="#fff"/>
    <rect x="0" y="330" width="6" height="80" rx="3" fill="#8E44AD"/>
    <text x="24" y="363" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1B3A5C">Bureau de contrôle agréé</text>
    <text x="24" y="388" font-family="Arial, sans-serif" font-size="15" fill="#5D6D7E">Zones 3 &amp; 4 — visa obligatoire plans structure</text>

    <!-- Alert box -->
    <rect x="0" y="428" width="540" height="60" rx="10" fill="#FDEDEC"/>
    <rect x="0" y="428" width="6" height="60" rx="3" fill="#E74C3C"/>
    <text x="24" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#C0392B">⚠️  Non-conformité = refus de permis + démolition</text>
    <text x="24" y="477" font-family="Arial, sans-serif" font-size="14" fill="#C0392B">Sanctions renforcées depuis janvier 2024</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="740" width="1200" height="60" fill="#1B3A5C"/>
  <text x="600" y="778" font-family="Arial, sans-serif" font-size="20" fill="#A8C8E8" text-anchor="middle">Source : Ministère de l'Habitat — RPS 2011 révisé 2024 · ShantiLink</text>
</svg>
