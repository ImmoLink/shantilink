services:
  - type: web
    name: shantilink
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SHANTILINK_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
