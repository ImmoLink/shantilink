name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install production dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Install dev / test dependencies
        run: pip install -r requirements-dev.txt

      - name: Syntax check — core.py
        run: python -c "import ast; ast.parse(open('core.py', encoding='utf-8').read()); print('core.py OK')"

      - name: Syntax check — routers
        run: |
          for f in routers/*.py; do
            python -c "import ast; ast.parse(open('$f', encoding='utf-8').read()); print('$f OK')"
          done

      - name: Syntax check — tests
        run: |
          for f in tests/*.py; do
            python -c "import ast; ast.parse(open('$f', encoding='utf-8').read()); print('$f OK')"
          done

      - name: Run tests
        env:
          DATABASE_URL: "sqlite://"
          SHANTILINK_SECRET: "test-secret-key-for-ci-2025"
          ENV: "dev"
        run: pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install flake8
        run: pip install flake8
      - name: Lint routers (errors only)
        run: flake8 routers/ core.py --max-line-length=120 --select=E9,F63,F7,F82 || true
